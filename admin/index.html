<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Studio</title>
<link rel="preload" href="/__proof/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/__proof/fonts/studio-fonts.css">
<link rel="stylesheet" href="/__proof/fonts/fonts.css">
<link rel="stylesheet" href="/app.css">
<script>try{var t=localStorage.getItem("studio.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Studio">
    <a class="brand" href="#/">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brandtext"><span class="wordmark">Studio</span><span class="domain" id="rootDomain"></span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="overview"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7L8 2.5 13.5 7v6.5h-11z"/></svg><span>Overview</span></a>
      <a href="#/review" data-nav="review"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11"/><path d="M5 8l2 2 4-4"/></svg><span>Review</span><em id="navReview"></em></a>
      <a href="#/brands" data-nav="brands"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11M2.5 8h5.5"/><circle cx="11" cy="5.5" r="1"/></svg><span>Brands</span></a>
      <span class="grp">Plan</span>
      <a href="#/calendar" data-nav="calendar"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg><span>Calendar</span></a>
      <a href="#/campaigns" data-nav="campaigns"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5l5 3V3L5 6z"/><path d="M12.5 5.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"/></svg><span>Campaigns</span></a>
      <span class="grp">Publish</span>
      <a href="#/social" data-nav="social"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="8" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="12" cy="12" r="2"/><path d="M5.8 7.1l4.4-2.2M5.8 8.9l4.4 2.2"/></svg><span>Social</span></a>
      <a href="#/emails" data-nav="emails"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9"/><path d="M2 4l6 5 6-5"/></svg><span>Emails</span><em id="navEmails"></em></a>
      <a href="#/automations" data-nav="automations"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><path d="M4 6v3.5a2 2 0 002 2h4"/></svg><span>Automations</span><em id="navAuto"></em></a>
      <span class="grp">Audience</span>
      <a href="#/contacts" data-nav="contacts"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.3 2.3-3.5 4.5-3.5s3.9 1.2 4.5 3.5M11 3.5a2.5 2.5 0 010 4.5M12.5 10.3c1 .6 1.7 1.7 2 3.2"/></svg><span>Contacts</span><em id="navContacts"></em></a>
      <a href="#/forms" data-nav="forms"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5"/></svg><span>Forms</span></a>
      <a href="#/sites" data-nav="sites" class="grp">Sites</a>
      <div id="navSites" class="sites"></div>
      <a href="#/sites/new" class="site add"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M4 0v8M0 4h8"/></svg><span>New site</span></a>
    </nav>
    <div class="sidefoot">
      <a href="#/files" data-nav="files" class="navlink"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5V13h12V5.5H7.5L6 3.5H2z"/></svg><span>Files</span></a>
      <a href="#/settings" data-nav="settings" class="navlink"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Settings</span></a>
      <form method="post" action="/auth/logout" style="margin:0"><button type="submit" class="navlink" style="background:none;border:0;cursor:pointer;width:100%;font:inherit;text-align:left"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5L13.5 8l-3 3M13.5 8H6"/></svg><span>Sign out</span></button></form>
      <div class="me">
        <span class="avatar" id="avatar" aria-hidden="true">A</span>
        <span class="who"><b>Aisling</b><small id="meEmail"></small></span>
        <button type="button" class="themebtn" id="themeBtn" aria-label="Switch theme">
          <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z"/></svg>
          <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <main id="view" class="view"><div class="loading">Loading…</div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
